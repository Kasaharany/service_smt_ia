[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["core", "services", "ui", "config"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
# Textos longos em português (markdown de UI, mensagens ao usuário) são
# conteúdo, não código — não vale a pena quebrá-los por limite de coluna.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["core"]
